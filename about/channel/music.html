<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루시드로이드 | 음악 명령어</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="SSS.ico" type="image/x-icon">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo-container">
        <img src="sss.png" alt="루시드로이드 로고" class="logo-img">
        <h1>루시드로이드</h1>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/">홈</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/about/about.html" class="active">명령어</a></li>
          <li><a href="https://discord.gg/vFMhrbjMDY">디스코드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="command-detail-page">
    <aside class="sidebar">
      <h3>🎵 음악 명령어</h3>
      <ul id="commandList">
        <li><a href="#" data-command="play">재생</a></li>
        <li><a href="#" data-command="pause">일시정지/재개</a></li>
        <li><a href="#" data-command="skip">다음곡</a></li>
        <li><a href="#" data-command="stop">멈춤</a></li>
        <li><a href="#" data-command="queue">재생목록</a></li>
        <li><a href="#" data-command="playtime">재생시간</a></li>
        <li><a href="#" data-command="seek">탐색</a></li>
      </ul>
    </aside>

    <section class="command-detail" id="commandContent">
      <h2>명령어를 선택해주세요!</h2>
      <p class="subtitle">왼쪽 목록에서 보고 싶은 명령어를 클릭하세요.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2025 루시드로이드. All rights reserved.</p>
      <div class="policies">
        <h3>약관 및 방침</h3>
        <ul>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/tos.html">서비스 이용약관</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/privacy.html">개인정보 처리방침</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/copyright.html">저작권 정책</a></li>
        </ul>
      </div>
      <div class="support">
        <h3>지원</h3>
        <ul>
          <li><a href="https://discord.gg/vFMhrbjMDY">공식 커뮤니티</a></li>
          <li><a href="mailto:lime159@icloud.com">이메일 문의</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script>
    const commands = {
      play: {
        title: "재생",
        shortDesc: "음악을 재생합니다!",
        longDesc: "유튜브 곡 제목이나 링크를 입력하면 봇이 음성 채널에 입장하여 음악을 재생합니다!",
        usage: "/재생 '곡 제목' 또는 'URL'",
      },
      pause: {
        title: "일시정지/재개",
        shortDesc: "일시정지: 현재 음악을 일시정지합니다.<br> 재개: 일시정지된 음악을 다시 재생합니다.",
        longDesc: "일시정지 : 재생 중인 음악을 잠시 멈춥니다. '/재개' 명령으로 다시 이어 들을 수 있습니다. <br> 재개: 명령은 일시정지된 음악을 다시 재생합니다!",
        usage: "/일시정지<br><code>/재개</code>",
      },
      resume: {
        title: "재개",
        shortDesc: "일시정지된 음악을 재개합니다!",
        longDesc: "일시정지 상태의 음악을 이어서 재생합니다!",
        usage: "/재개",
      },
      skip: {
        title: "다음곡",
        shortDesc: "현재 곡을 건너뜁니다.",
        longDesc: "현재 재생 중인 음악을 종료하고 대기열에 있는 다음 곡을 재생합니다!",
        usage: "/다음곡",
      },
      stop: {
        title: "멈춤",
        shortDesc: "모든 노래를 지우고 종료합니다.",
        longDesc: "재생 중인 포함하여 중단하고 음성 채널에서 나갑니다!",
        usage: "/멈춤",
      },
      queue: {
        title: "재생목록",
        shortDesc: "대기 중인 곡 목록을 보여줍니다!",
        longDesc: "다음에 재생될 곡 목록을 순서대로 표시합니다!",
        usage: "/재생목록",
      },
      playtime: {
        title: "재생시간",
        shortDesc: "현재 곡의 재생 시간을 표시합니다.",
        longDesc: "현재 재생 중인 곡의 전체 길이와 현재 재생 위치를 알려줍니다.",
        usage: "/재생시간",
      },
      seek: {
        title: "탐색",
        shortDesc: "현재 곡의 특정 시간으로 이동합니다.",
        longDesc: "현재 재생 중인 곡에서 지정된 시간(초 또는 분:초) 위치로 이동합니다.",
        usage: "/탐색 [시간] 예시'1:30' 또는 '90'",
      },
    };

    const commandList = document.getElementById("commandList");
    const commandContent = document.getElementById("commandContent");

    commandList.addEventListener("click", (e) => {
      e.preventDefault();
      const cmd = e.target.dataset.command;
      if (!cmd || !commands[cmd]) return;

      document.querySelectorAll("#commandList a").forEach(a => a.classList.remove("active"));
      e.target.classList.add("active");

      const { title, shortDesc, longDesc, usage } = commands[cmd];
      commandContent.innerHTML = `
        <h2>${title}</h2>
        <p class="subtitle">${shortDesc}</p>
        <div class="alert-box">⚠️ 일부 명령어 문서는 아직 작성 중입니다! 빠른 시일 내에 모두 작성할 예정이니 양해 부탁드립니다!</div>
        <div class="command-section"><h3>설명</h3><p>${longDesc}</p></div>
        <div class="command-section"><h3>사용법</h3><p><code>${usage}</code></p></div>
      `;
    });
  </script>
</body>
</html>
