<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루시드로이드 | 관리 명령어</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="SSS.ico" type="image/x-icon">
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="container">
      <div class="logo-container">
        <img src="sss.png" alt="루시드로이드 로고" class="logo-img">
        <h1>루시드로이드</h1>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="commands.html" class="active">명령어</a></li>
          <li><a href="contact.html">디스코드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 메인 -->
  <main class="command-detail-page">
    <aside class="sidebar">
      <h3>🛠️ 관리 명령어</h3>
      <ul id="commandList">
        <li><a href="#" data-command="network">네트워크</a></li>
        <li><a href="#" data-command="ping">핑</a></li>
        <li><a href="#" data-command="runtime">런타임</a></li>
        <li><a href="#" data-command="server">서버수</a></li>
        <li><a href="#" data-command="speed">속도측정</a></li>
      </ul>
    </aside>

    <section class="command-detail" id="commandContent">
      <h2>명령어를 선택해주세요!</h2>
      <p class="subtitle">왼쪽 목록에서 보고 싶은 명령어를 클릭하세요.</p>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© 2025 루시드로이드. All rights reserved.</p>
      <div class="policies">
        <h3>약관 및 방침</h3>
        <ul>
          <li><a href="tos.html">서비스 이용약관</a></li>
          <li><a href="privacy.html">개인정보 처리방침</a></li>
          <li><a href="copyright.html">저작권 정책</a></li>
        </ul>
      </div>
      <div class="support">
        <h3>지원</h3>
        <ul>
          <li><a href="https://discord.gg/vFMhrbjMDY">공식 커뮤니티</a></li>
          <li><a href="mailto:email@email.com">이메일 문의</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script>
    // 명령어 데이터 (shortDesc / longDesc)
    const commands = {
      network: {
        title: "네트워크",
        shortDesc: "루시드로이드 의 네트워크 상태를 확인합니다.",
        longDesc: "루시드로이드가 외부 서비스와 통신하는 네트워크 상태(지연, 패킷 손실 등)를 점검하고 요약해서 보여줍니다.",
        usage: "/네트워크",
      },
      ping: {
        title: "핑",
        shortDesc: "서버 응답 속도를 표시합니다.",
        longDesc: "루시드로이드 이 명령을 수신하고 응답까지 걸리는 시간을 밀리초(ms) 단위로 측정해 결과를 보여줍니다.",
        usage: "/핑",
      },
      runtime: {
        title: "런타임",
        shortDesc: "루시드로이드 의 가동 시간 및 성능 정보를 확인합니다.",
        longDesc: "프로세스 가동 시간(uptime), 메모리 사용량, CPU 사용률 등의 런타임 정보를 제공합니다. 운영 모니터링에 유용합니다.",
        usage: "/런타임",
      },
      server: {
        title: "서버수",
        shortDesc: "현재 접속된 서버 수를 확인합니다.",
        longDesc: "루시드로이드가 참여하고 있는 전체 서버 의 수를 표시합니다.",
        usage: "/서버수",
      },
      speed: {
        title: "속도측정",
        shortDesc: "루시드로이드 의 네트워크 다운로드/업로드 속도를 테스트합니다!",
        longDesc: "루시드로이드 의 네트워크 다운로드/업로드 속도를 테스트합니다. 측정된 속도는 인터넷 속도 확인합니다!",
        usage: "/속도측정",
      }
    };

    const commandList = document.getElementById("commandList");
    const commandContent = document.getElementById("commandContent");

    // 클릭 이벤트
    commandList.addEventListener("click", (e) => {
      e.preventDefault();
      const cmd = e.target.dataset.command;
      if (!cmd || !commands[cmd]) return;

      // 활성화 표시
      document.querySelectorAll("#commandList a").forEach(a => a.classList.remove("active"));
      e.target.classList.add("active");

      // 내용 교체
      const { title, shortDesc, longDesc, usage } = commands[cmd];
      commandContent.innerHTML = `
        <h2>${title}</h2>
        <p class="subtitle">${shortDesc}</p>
        <div class="alert-box">
          ⚠️ 이 명령어 문서는 아직 작성 중이에요.  
          궁금한 점이 있다면 커뮤니티에서 질문해주세요!
        </div>
        <div class="command-section">
          <h3>설명</h3>
          <p>${longDesc}</p>
        </div>
        <div class="command-section">
          <h3>사용법</h3>
          <p><code>${usage}</code></p>
        </div>
      `;
    });
  </script>
</body>
</html>
