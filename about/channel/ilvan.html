<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루시드로이드 | 명령어</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="SSS.ico" type="image/x-icon">
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="container">
      <div class="logo-container">
        <img src="sss.png" alt="루시드로이드 로고" class="logo-img">
        <h1>루시드로이드</h1>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/">홈</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/about/about.html" class="active">명령어</a></li>
          <li><a href="https://discord.gg/vFMhrbjMDY">디스코드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 메인 -->
  <main class="command-detail-page">
    <aside class="sidebar">
      <h3>📋 일반 명령어</h3>
      <ul id="commandList">
        <li><a href="#" data-command="news">뉴스</a></li>
        <li><a href="#" data-command="weather">날씨</a></li>
        <li><a href="#" data-command="explain">설명</a></li>
        <li><a href="#" data-command="dice">주사위</a></li>
        <li><a href="#" data-command="hangang">한강온도</a></li>
        <li><a href="#" data-command="portal">포탈</a></li>
        <li><a href="#" data-command="soul">소울</a></li>
        <li><a href="#" data-command="wonderberry">원더베리</a></li>
        <li><a href="#" data-command="event">이벤트</a></li>
        <li><a href="#" data-command="notice">공지</a></li>
        <li><a href="#" data-command="강화">강화</a></li>
        <li><a href="#" data-command="apple">애플</a></li>
      </ul>
    </aside>

    <section class="command-detail" id="commandContent">
      <h2>명령어를 선택해주세요!</h2>
      <p class="subtitle">왼쪽 목록에서 보고 싶은 명령어를 클릭하세요.</p>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© 2025 루시드로이드. All rights reserved.</p>
      <div class="policies">
        <h3>약관 및 방침</h3>
        <ul>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/tos.html">서비스 이용약관</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/privacy.html">개인정보 처리방침</a></li>
          <li><a href="https://lime-story.github.io/lucidroid.github.io/copyright.html">저작권 정책</a></li>
        </ul>
      </div>
      <div class="support">
        <h3>지원</h3>
        <ul>
          <li><a href="https://discord.gg/vFMhrbjMDY">공식 커뮤니티</a></li>
          <li><a href="mailto:lime159@icloud.com">이메일 문의</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script>
    // 명령어 데이터
    const commands = {
      news: {
        title: "뉴스",
        shortDesc: "최신 뉴스를 제공합니다!",
        longDesc: "뉴스를 보여줍니다. 정치, 경제, 사회, IT 등 다양하게 뉴스를 볼수있습니다!",
        usage: "/뉴스 '원하는 내용'",
      },
      weather: {
        title: "날씨",
        shortDesc: "현재 날씨 정보를 제공합니다!",
        longDesc: "입력한 지역의 실시간 날씨, 기온 알려줍니다<br> '오늘'을 입력하면 전국 날씨가 표시됩니다!",
        usage: "/날씨 '지역명' 또는 '오늘'",
      },
      hangang: {
        title: "한강온도",
        shortDesc: "지금 한강의 수온을 알려줍니다!",
        longDesc: "한강 수온 데이터를 불러와 현재 온도를 알려줍니다.<br> 낚시에 참고용으로 유용합니다!",
        usage: "/한강온도",
      },
      explain: {
        title: "설명",
        shortDesc: "루시드로이드의 명령어 설명을 나옵니다!",
        longDesc: "이 명령어는 각종 명령어의 사용법과 설명을 제공합니다.<br> 궁금한 명령어가 있다면 이 명령어로 확인해보세요!",
        usage: "/설명",
      },
      dice: {
        title: "주사위",
        shortDesc: "가상 주사위를 굴립니다!",
        longDesc: "1부터 100까지의 숫자 중 하나를 무작위로 선택하여 주사위 결과를 제공합니다.<br> 게임이나 결정이 필요할 때 유용합니다!",
        usage: "/주사위",
      },
      portal: {
        title: "포탈",
        shortDesc: "메이플스토리 에서 유용한 사이트 모음포탈 입니다!",
        longDesc: "메이플스토리 관련 다양한 유용한 사이트 링크를 제공합니다.<br> 게임 플레이에 도움이 되는 정보들을 쉽게 찾을 수 있습니다!",
        usage: "/포탈",
      },
      soul: {
        title: "소울",
        shortDesc: "루시드소울조각 시뮬레이터!",
        longDesc: "소울웨폰의 시뮬레이터.<br> 위대한 소울 뽑을수 있을까요!",
        usage: "/소울",
      },
      wonderberry: {
        title: "원더베리",
        shortDesc: "원더베리 시뮬레이터!",
        longDesc: "원더베리 시뮬레이터입니다.<br> 과연 어떤 아이템이 나올까요!",
        usage: "/원더베리",
      },
      event: {
        title: "이벤트",
        shortDesc: "메이플스토리 이벤트 정보를 제공합니다!",
        longDesc: "현재 진행 중인 메이플스토리 이벤트 정보를 알려줍니다.<br> 놓치지 말고 참여해보세요!",
        usage: "/이벤트",
      },
      notice: {
        title: "공지",
        shortDesc: "메이플스토리 공지사항을 알려드립니다!",
        longDesc: "메이플스토리의 최신 공지사항을 제공합니다.<br> 업데이트, 점검 등 중요한 정보를 빠르게 확인하세요!",
        usage: "/공지",
      },
      강화: {
        title: "강화",
        shortDesc: "메이플스토리 강화 시뮬레이터!",
        longDesc: "장비 강화 시뮬레이터입니다.<br> 과연 몇강까지 갈수 있을까요!",
        usage: "/강화",
      },
      apple: {
        title: "애플",
        shortDesc: "플레티넘 애플 시뮬레이터!",
        longDesc: "플레티넘 애플 시뮬레이터 입니다.<br> 어떤 아이템이 나올까요!",
        usage: "/애플",
      },
    };

    const commandList = document.getElementById("commandList");
    const commandContent = document.getElementById("commandContent");

    // 클릭 이벤트
    commandList.addEventListener("click", (e) => {
      e.preventDefault();
      const cmd = e.target.dataset.command;
      if (!cmd || !commands[cmd]) return;

      // 활성화 표시
      document.querySelectorAll("#commandList a").forEach(a => a.classList.remove("active"));
      e.target.classList.add("active");

      // 내용 교체
      const { title, shortDesc, longDesc, usage } = commands[cmd];
      commandContent.innerHTML = `
        <h2>${title}</h2>
        <p class="subtitle">${shortDesc}</p>
        <div class="alert-box">
          ⚠️ 일부 명령어 문서는 아직 작성 중입니다!  
          궁금한 점이 있다면 커뮤니티에서 질문해주세요!
        </div>
        <div class="command-section">
          <h3>설명</h3>
          <p>${longDesc}</p>
        </div>
        <div class="command-section">
          <h3>사용법</h3>
          <p><code>${usage}</code></p>
        </div>
      `;
    });
  </script>
</body>
</html>
